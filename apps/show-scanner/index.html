<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vancouver & Squamish Shows</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            line-height: 1.6;
            padding: 1rem;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #333;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            color: #fff;
        }

        .subtitle {
            color: #888;
            font-size: 0.9rem;
        }

        .filters {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 0.5rem 1rem;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 6px;
            color: #e0e0e0;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .filter-btn:hover {
            background: #2a2a2a;
            border-color: #555;
        }

        .filter-btn.active {
            background: #2563eb;
            border-color: #2563eb;
            color: #fff;
        }

        .section {
            margin-bottom: 3rem;
        }

        .section-title {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .badge {
            background: #2563eb;
            color: #fff;
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .event {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 0.8rem;
            transition: all 0.2s;
        }

        .event:hover {
            background: #222;
            border-color: #555;
        }

        .event-date {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 0.3rem;
        }

        .event-artist {
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 0.3rem;
        }

        .event-venue {
            font-size: 0.9rem;
            color: #aaa;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #666;
        }

        .last-updated {
            text-align: center;
            color: #666;
            font-size: 0.85rem;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid #333;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: #666;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.5rem;
            }

            .section-title {
                font-size: 1.3rem;
            }

            .filters {
                gap: 0.5rem;
            }

            .filter-btn {
                padding: 0.4rem 0.8rem;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎸 Live Music</h1>
            <div class="subtitle">Vancouver & Squamish • Rock, Folk, Indie, Country, Punk</div>
        </header>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="vancouver">Vancouver</button>
            <button class="filter-btn" data-filter="squamish">Squamish</button>
            <div style="position: relative;">
                <button class="filter-btn" id="venue-filter-btn">Venues ▼</button>
                <div id="venue-dropdown" style="display: none; position: absolute; top: 100%; left: 0; background: #1a1a1a; border: 1px solid #555; border-radius: 6px; padding: 0.5rem; margin-top: 0.3rem; min-width: 200px; max-height: 300px; overflow-y: auto; z-index: 100;">
                    <div style="margin-bottom: 0.5rem; padding-bottom: 0.5rem; border-bottom: 1px solid #333;">
                        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; padding: 0.3rem;">
                            <input type="checkbox" id="select-all-venues" style="cursor: pointer;">
                            <span style="font-weight: 600;">Select All</span>
                        </label>
                    </div>
                    <div id="venue-checkboxes"></div>
                </div>
            </div>
        </div>

        <div id="content">
            <div class="loading">Loading shows...</div>
        </div>

        <div class="last-updated" id="last-updated"></div>
    </div>

    <script>
        const SQUAMISH_KEYWORDS = ['trickster', 'backyard', 'brackendale'];
        let allEvents = [];
        let currentFilter = 'all';
        let selectedVenues = new Set();
        let allVenues = [];

        async function loadEvents() {
            try {
                const response = await fetch('data/events.json');
                const data = await response.json();
                allEvents = data.events || [];
                
                // Extract unique venues
                allVenues = [...new Set(allEvents.map(e => e.venue))].sort();
                selectedVenues = new Set(allVenues); // All selected by default
                
                // Build venue checkboxes
                buildVenueFilter();
                
                // Update last updated timestamp
                if (data.generated) {
                    document.getElementById('last-updated').textContent = 
                        `Last updated: ${new Date(data.generated).toLocaleString()}`;
                }
                
                renderEvents();
            } catch (error) {
                document.getElementById('content').innerHTML = 
                    '<div class="empty-state">Failed to load events. Try refreshing.</div>';
            }
        }

        function buildVenueFilter() {
            const container = document.getElementById('venue-checkboxes');
            container.innerHTML = allVenues.map(venue => `
                <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; padding: 0.3rem; margin-bottom: 0.2rem;">
                    <input type="checkbox" class="venue-checkbox" value="${venue}" checked style="cursor: pointer;">
                    <span style="font-size: 0.9rem;">${venue}</span>
                </label>
            `).join('');
            
            // Add change listeners
            document.querySelectorAll('.venue-checkbox').forEach(cb => {
                cb.addEventListener('change', (e) => {
                    if (e.target.checked) {
                        selectedVenues.add(e.target.value);
                    } else {
                        selectedVenues.delete(e.target.value);
                    }
                    updateSelectAllState();
                    renderEvents();
                });
            });
        }

        function updateSelectAllState() {
            const selectAll = document.getElementById('select-all-venues');
            selectAll.checked = selectedVenues.size === allVenues.length;
        }

        function filterEvents(events) {
            // First filter by venue selection
            let filtered = events.filter(e => selectedVenues.has(e.venue));
            
            // Then filter by location if not "all"
            if (currentFilter === 'all') return filtered;
            
            const isSquamish = (event) => 
                SQUAMISH_KEYWORDS.some(kw => event.venue.toLowerCase().includes(kw));
            
            if (currentFilter === 'squamish') {
                return filtered.filter(isSquamish);
            } else if (currentFilter === 'vancouver') {
                return filtered.filter(e => !isSquamish(e));
            }
            
            return filtered;
        }

        function groupByLocation(events) {
            const vancouver = [];
            const squamish = [];
            
            events.forEach(event => {
                const isSquamish = SQUAMISH_KEYWORDS.some(kw => 
                    event.venue.toLowerCase().includes(kw)
                );
                if (isSquamish) {
                    squamish.push(event);
                } else {
                    vancouver.push(event);
                }
            });
            
            return { vancouver, squamish };
        }

        function parseDate(dateStr) {
            // Handle various formats
            const formats = [
                /(\w+)\s+(\d+),\s+(\d{4})/,  // March 23, 2026
                /(\d{4})-(\d{2})-(\d{2})/      // 2026-03-23
            ];
            
            for (const fmt of formats) {
                const match = dateStr.match(fmt);
                if (match) {
                    try {
                        return new Date(dateStr);
                    } catch (e) {
                        continue;
                    }
                }
            }
            
            return new Date('9999-12-31'); // TBD goes to end
        }

        function renderEvents() {
            const filtered = filterEvents(allEvents);
            const { vancouver, squamish } = groupByLocation(filtered);
            
            // Sort by date
            const sortByDate = (a, b) => parseDate(a.date) - parseDate(b.date);
            vancouver.sort(sortByDate);
            squamish.sort(sortByDate);
            
            let html = '';
            
            if (vancouver.length > 0 && (currentFilter === 'all' || currentFilter === 'vancouver')) {
                html += `
                    <div class="section">
                        <div class="section-title">
                            Vancouver
                            <span class="badge">${vancouver.length}</span>
                        </div>
                        ${vancouver.map(renderEvent).join('')}
                    </div>
                `;
            }
            
            if (squamish.length > 0 && (currentFilter === 'all' || currentFilter === 'squamish')) {
                html += `
                    <div class="section">
                        <div class="section-title">
                            Squamish
                            <span class="badge">${squamish.length}</span>
                        </div>
                        ${squamish.map(renderEvent).join('')}
                    </div>
                `;
            }
            
            if (html === '') {
                html = '<div class="empty-state">No shows found matching your filters.</div>';
            }
            
            document.getElementById('content').innerHTML = html;
        }

        function renderEvent(event) {
            const link = event.link ? 
                `<a href="${event.link}" target="_blank" style="color: inherit; text-decoration: none;">` : '';
            const linkClose = event.link ? '</a>' : '';
            
            return `
                <div class="event">
                    ${link}
                    <div class="event-date">${event.date}</div>
                    <div class="event-artist">${event.artist}</div>
                    <div class="event-venue">${event.venue}</div>
                    ${linkClose}
                </div>
            `;
        }

        // Filter button handlers
        document.querySelectorAll('.filter-btn').forEach(btn => {
            if (btn.id === 'venue-filter-btn') return; // Skip venue dropdown button
            
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => {
                    if (b.id !== 'venue-filter-btn') b.classList.remove('active');
                });
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderEvents();
            });
        });

        // Venue dropdown toggle
        const venueBtn = document.getElementById('venue-filter-btn');
        const venueDropdown = document.getElementById('venue-dropdown');
        
        venueBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            venueDropdown.style.display = venueDropdown.style.display === 'none' ? 'block' : 'none';
        });

        // Close dropdown when clicking outside
        document.addEventListener('click', (e) => {
            if (!venueDropdown.contains(e.target) && e.target !== venueBtn) {
                venueDropdown.style.display = 'none';
            }
        });

        // Select all handler
        document.getElementById('select-all-venues').addEventListener('change', (e) => {
            const checked = e.target.checked;
            document.querySelectorAll('.venue-checkbox').forEach(cb => {
                cb.checked = checked;
                if (checked) {
                    selectedVenues.add(cb.value);
                } else {
                    selectedVenues.delete(cb.value);
                }
            });
            renderEvents();
        });

        // Load on page load
        loadEvents();
    </script>
</body>
</html>
