<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vancouver & Squamish Shows</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            line-height: 1.6;
            padding: 1rem;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #333;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            color: #fff;
        }

        .subtitle {
            color: #888;
            font-size: 0.9rem;
        }

        .filters {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 0.5rem 1rem;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 6px;
            color: #e0e0e0;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .filter-btn:hover {
            background: #2a2a2a;
            border-color: #555;
        }

        .filter-btn.active {
            background: #2563eb;
            border-color: #2563eb;
            color: #fff;
        }

        .section {
            margin-bottom: 3rem;
        }

        .section-title {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .badge {
            background: #2563eb;
            color: #fff;
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .event {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 0.8rem;
            transition: all 0.2s;
        }

        .event:hover {
            background: #222;
            border-color: #555;
        }

        .event-date {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 0.3rem;
        }

        .event-artist {
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 0.3rem;
        }

        .event-venue {
            font-size: 0.9rem;
            color: #aaa;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #666;
        }

        .last-updated {
            text-align: center;
            color: #666;
            font-size: 0.85rem;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid #333;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: #666;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.5rem;
            }

            .section-title {
                font-size: 1.3rem;
            }

            .filters {
                gap: 0.5rem;
            }

            .filter-btn {
                padding: 0.4rem 0.8rem;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎸 Live Music</h1>
            <div class="subtitle">Vancouver & Squamish • Rock, Folk, Indie, Country, Punk</div>
        </header>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="vancouver">Vancouver</button>
            <button class="filter-btn" data-filter="squamish">Squamish</button>
        </div>

        <div id="content">
            <div class="loading">Loading shows...</div>
        </div>

        <div class="last-updated" id="last-updated"></div>
    </div>

    <script>
        const SQUAMISH_KEYWORDS = ['trickster', 'backyard', 'brackendale'];
        let allEvents = [];
        let currentFilter = 'all';

        async function loadEvents() {
            try {
                const response = await fetch('data/events.json');
                const data = await response.json();
                allEvents = data.events || [];
                
                // Update last updated timestamp
                if (data.generated) {
                    document.getElementById('last-updated').textContent = 
                        `Last updated: ${new Date(data.generated).toLocaleString()}`;
                }
                
                renderEvents();
            } catch (error) {
                document.getElementById('content').innerHTML = 
                    '<div class="empty-state">Failed to load events. Try refreshing.</div>';
            }
        }

        function filterEvents(events) {
            if (currentFilter === 'all') return events;
            
            const isSquamish = (event) => 
                SQUAMISH_KEYWORDS.some(kw => event.venue.toLowerCase().includes(kw));
            
            if (currentFilter === 'squamish') {
                return events.filter(isSquamish);
            } else if (currentFilter === 'vancouver') {
                return events.filter(e => !isSquamish(e));
            }
            
            return events;
        }

        function groupByLocation(events) {
            const vancouver = [];
            const squamish = [];
            
            events.forEach(event => {
                const isSquamish = SQUAMISH_KEYWORDS.some(kw => 
                    event.venue.toLowerCase().includes(kw)
                );
                if (isSquamish) {
                    squamish.push(event);
                } else {
                    vancouver.push(event);
                }
            });
            
            return { vancouver, squamish };
        }

        function parseDate(dateStr) {
            // Handle various formats
            const formats = [
                /(\w+)\s+(\d+),\s+(\d{4})/,  // March 23, 2026
                /(\d{4})-(\d{2})-(\d{2})/      // 2026-03-23
            ];
            
            for (const fmt of formats) {
                const match = dateStr.match(fmt);
                if (match) {
                    try {
                        return new Date(dateStr);
                    } catch (e) {
                        continue;
                    }
                }
            }
            
            return new Date('9999-12-31'); // TBD goes to end
        }

        function renderEvents() {
            const filtered = filterEvents(allEvents);
            const { vancouver, squamish } = groupByLocation(filtered);
            
            // Sort by date
            const sortByDate = (a, b) => parseDate(a.date) - parseDate(b.date);
            vancouver.sort(sortByDate);
            squamish.sort(sortByDate);
            
            let html = '';
            
            if (vancouver.length > 0 && (currentFilter === 'all' || currentFilter === 'vancouver')) {
                html += `
                    <div class="section">
                        <div class="section-title">
                            Vancouver
                            <span class="badge">${vancouver.length}</span>
                        </div>
                        ${vancouver.map(renderEvent).join('')}
                    </div>
                `;
            }
            
            if (squamish.length > 0 && (currentFilter === 'all' || currentFilter === 'squamish')) {
                html += `
                    <div class="section">
                        <div class="section-title">
                            Squamish
                            <span class="badge">${squamish.length}</span>
                        </div>
                        ${squamish.map(renderEvent).join('')}
                    </div>
                `;
            }
            
            if (html === '') {
                html = '<div class="empty-state">No shows found matching your filters.</div>';
            }
            
            document.getElementById('content').innerHTML = html;
        }

        function renderEvent(event) {
            const link = event.link ? 
                `<a href="${event.link}" target="_blank" style="color: inherit; text-decoration: none;">` : '';
            const linkClose = event.link ? '</a>' : '';
            
            return `
                <div class="event">
                    ${link}
                    <div class="event-date">${event.date}</div>
                    <div class="event-artist">${event.artist}</div>
                    <div class="event-venue">${event.venue}</div>
                    ${linkClose}
                </div>
            `;
        }

        // Filter button handlers
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderEvents();
            });
        });

        // Load on page load
        loadEvents();
    </script>
</body>
</html>
