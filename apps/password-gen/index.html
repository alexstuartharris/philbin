<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Generator — Secure, No Sign Up | Philbin</title>
  <meta name="description" content="Generate strong, secure passwords instantly. No sign-up, no tracking, 100% client-side. Check password strength and customize length, characters, and more.">
  
  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Free Password Generator — No Sign Up">
  <meta property="og:description" content="Generate secure passwords instantly. No account needed.">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --surface-elevated: #1a1a1a;
      --surface-hover: #202020;
      --border: #2a2a2a;
      --border-focus: #3a3a3a;
      --text: #f5f5f5;
      --text-secondary: #a0a0a0;
      --text-tertiary: #6a6a6a;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --accent-light: rgba(99, 102, 241, 0.1);
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .header h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }

    .header .tagline {
      color: var(--text-secondary);
      font-size: 1.1rem;
    }

    /* Password Display */
    .password-display {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .password-output {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .password-text {
      flex: 1;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.25rem;
      font-weight: 500;
      color: var(--text);
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 1rem 1.25rem;
      word-break: break-all;
      min-height: 56px;
      display: flex;
      align-items: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.875rem 1.5rem;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 500;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all var(--transition);
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-secondary:hover {
      background: var(--surface-hover);
      border-color: var(--border-focus);
    }

    .btn-icon {
      padding: 0.75rem;
      min-width: 48px;
    }

    .btn svg {
      width: 20px;
      height: 20px;
    }

    /* Strength Meter */
    .strength-meter {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .strength-bars {
      display: flex;
      gap: 4px;
      flex: 1;
    }

    .strength-bar {
      height: 6px;
      flex: 1;
      background: var(--border);
      border-radius: 3px;
      transition: background var(--transition);
    }

    .strength-bar.active {
      background: var(--danger);
    }

    .strength-meter[data-strength="weak"] .strength-bar.active {
      background: var(--danger);
    }

    .strength-meter[data-strength="fair"] .strength-bar.active {
      background: var(--warning);
    }

    .strength-meter[data-strength="good"] .strength-bar.active {
      background: #84cc16;
    }

    .strength-meter[data-strength="strong"] .strength-bar.active {
      background: var(--success);
    }

    .strength-label {
      font-size: 0.85rem;
      font-weight: 500;
      min-width: 60px;
      text-align: right;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .strength-meter[data-strength="weak"] .strength-label { color: var(--danger); }
    .strength-meter[data-strength="fair"] .strength-label { color: var(--warning); }
    .strength-meter[data-strength="good"] .strength-label { color: #84cc16; }
    .strength-meter[data-strength="strong"] .strength-label { color: var(--success); }

    /* Options */
    .options {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .option-group {
      margin-bottom: 1.5rem;
    }

    .option-group:last-child {
      margin-bottom: 0;
    }

    .option-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .option-label span {
      font-weight: 500;
    }

    .option-value {
      font-family: 'JetBrains Mono', monospace;
      color: var(--accent);
      font-weight: 500;
    }

    .slider {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: var(--border);
      appearance: none;
      cursor: pointer;
    }

    .slider::-webkit-slider-thumb {
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      transition: transform var(--transition);
    }

    .slider::-webkit-slider-thumb:hover {
      transform: scale(1.1);
    }

    .slider::-moz-range-thumb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      cursor: pointer;
    }

    /* Checkboxes */
    .checkbox-group {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all var(--transition);
    }

    .checkbox-item:hover {
      border-color: var(--border-focus);
    }

    .checkbox-item.active {
      border-color: var(--accent);
      background: var(--accent-light);
    }

    .checkbox-item input {
      display: none;
    }

    .checkbox-box {
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition);
    }

    .checkbox-item.active .checkbox-box {
      background: var(--accent);
      border-color: var(--accent);
    }

    .checkbox-box svg {
      width: 12px;
      height: 12px;
      stroke: white;
      stroke-width: 3;
      opacity: 0;
      transition: opacity var(--transition);
    }

    .checkbox-item.active .checkbox-box svg {
      opacity: 1;
    }

    .checkbox-text {
      font-size: 0.9rem;
    }

    /* Actions */
    .actions {
      display: flex;
      gap: 1rem;
    }

    .actions .btn {
      flex: 1;
    }

    /* Password Checker */
    .checker {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-top: 2rem;
    }

    .checker h2 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }

    .checker-input {
      width: 100%;
      padding: 1rem 1.25rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1rem;
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      transition: border-color var(--transition);
    }

    .checker-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .checker-input::placeholder {
      color: var(--text-tertiary);
    }

    .checker-results {
      margin-top: 1rem;
      padding: 1rem;
      background: var(--surface-elevated);
      border-radius: var(--radius-sm);
      display: none;
    }

    .checker-results.visible {
      display: block;
    }

    .crack-time {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .crack-detail {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .criteria-list {
      margin-top: 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .criteria-item {
      display: flex;
      align-items: center;
      gap: 0.375rem;
      font-size: 0.8rem;
      padding: 0.375rem 0.75rem;
      background: var(--surface);
      border-radius: 999px;
    }

    .criteria-item.pass {
      color: var(--success);
    }

    .criteria-item.fail {
      color: var(--text-tertiary);
    }

    .criteria-item svg {
      width: 14px;
      height: 14px;
    }

    /* Footer */
    .footer {
      text-align: center;
      margin-top: 3rem;
      padding-top: 2rem;
      border-top: 1px solid var(--border);
      color: var(--text-tertiary);
      font-size: 0.85rem;
    }

    .footer a {
      color: var(--accent);
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      padding: 1rem 1.5rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1000;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast svg {
      width: 20px;
      height: 20px;
      color: var(--success);
    }

    @media (max-width: 500px) {
      .checkbox-group {
        grid-template-columns: 1fr;
      }
      
      .actions {
        flex-direction: column;
      }

      .password-output {
        flex-direction: column;
        gap: 0.75rem;
      }

      .password-output .btn-icon {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>🔐 Password Generator</h1>
      <p class="tagline">Secure passwords. No sign-up. No tracking.</p>
    </header>

    <div class="password-display">
      <div class="password-output">
        <div class="password-text" id="password">Click Generate</div>
        <button class="btn btn-secondary btn-icon" id="copyBtn" title="Copy to clipboard">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
          </svg>
        </button>
      </div>
      <div class="strength-meter" id="strengthMeter" data-strength="weak">
        <div class="strength-bars">
          <div class="strength-bar active"></div>
          <div class="strength-bar"></div>
          <div class="strength-bar"></div>
          <div class="strength-bar"></div>
        </div>
        <span class="strength-label" id="strengthLabel">Weak</span>
      </div>
    </div>

    <div class="options">
      <div class="option-group">
        <div class="option-label">
          <span>Length</span>
          <span class="option-value" id="lengthValue">16</span>
        </div>
        <input type="range" class="slider" id="lengthSlider" min="8" max="64" value="16">
      </div>

      <div class="option-group">
        <div class="option-label">
          <span>Include</span>
        </div>
        <div class="checkbox-group">
          <label class="checkbox-item active" data-option="uppercase">
            <input type="checkbox" checked>
            <span class="checkbox-box">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
              </svg>
            </span>
            <span class="checkbox-text">ABC</span>
          </label>
          <label class="checkbox-item active" data-option="lowercase">
            <input type="checkbox" checked>
            <span class="checkbox-box">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
              </svg>
            </span>
            <span class="checkbox-text">abc</span>
          </label>
          <label class="checkbox-item active" data-option="numbers">
            <input type="checkbox" checked>
            <span class="checkbox-box">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
              </svg>
            </span>
            <span class="checkbox-text">123</span>
          </label>
          <label class="checkbox-item active" data-option="symbols">
            <input type="checkbox" checked>
            <span class="checkbox-box">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
              </svg>
            </span>
            <span class="checkbox-text">!@#</span>
          </label>
        </div>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="generateBtn">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
        </svg>
        Generate Password
      </button>
      <button class="btn btn-secondary" id="copyBtnLarge">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
        </svg>
        Copy
      </button>
    </div>

    <div class="checker">
      <h2>Check Your Password</h2>
      <input type="text" class="checker-input" id="checkerInput" placeholder="Enter a password to check its strength...">
      <div class="checker-results" id="checkerResults">
        <div class="strength-meter" id="checkerStrength" data-strength="weak">
          <div class="strength-bars">
            <div class="strength-bar active"></div>
            <div class="strength-bar"></div>
            <div class="strength-bar"></div>
            <div class="strength-bar"></div>
          </div>
          <span class="strength-label" id="checkerStrengthLabel">Weak</span>
        </div>
        <p class="crack-time" id="crackTime"></p>
        <p class="crack-detail" id="crackDetail"></p>
        <div class="criteria-list" id="criteriaList"></div>
      </div>
    </div>

    <footer class="footer">
      <p>All passwords generated locally in your browser.</p>
      <p>No data is sent anywhere. Ever.</p>
      <p style="margin-top: 1rem;"><a href="../">← Back to Philbin Tools</a></p>
    </footer>
  </div>

  <div class="toast" id="toast">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
    </svg>
    <span>Copied to clipboard!</span>
  </div>

  <script>
    const charsets = {
      uppercase: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
      lowercase: 'abcdefghijklmnopqrstuvwxyz',
      numbers: '0123456789',
      symbols: '!@#$%^&*()_+-=[]{}|;:,.<>?'
    };

    const options = {
      length: 16,
      uppercase: true,
      lowercase: true,
      numbers: true,
      symbols: true
    };

    const passwordEl = document.getElementById('password');
    const lengthSlider = document.getElementById('lengthSlider');
    const lengthValue = document.getElementById('lengthValue');
    const generateBtn = document.getElementById('generateBtn');
    const copyBtn = document.getElementById('copyBtn');
    const copyBtnLarge = document.getElementById('copyBtnLarge');
    const strengthMeter = document.getElementById('strengthMeter');
    const strengthLabel = document.getElementById('strengthLabel');
    const checkerInput = document.getElementById('checkerInput');
    const checkerResults = document.getElementById('checkerResults');
    const toast = document.getElementById('toast');

    // Checkbox handlers
    document.querySelectorAll('.checkbox-item').forEach(item => {
      item.addEventListener('click', () => {
        const option = item.dataset.option;
        const input = item.querySelector('input');
        
        // Ensure at least one option is selected
        const activeCount = document.querySelectorAll('.checkbox-item.active').length;
        if (item.classList.contains('active') && activeCount <= 1) {
          return;
        }

        item.classList.toggle('active');
        input.checked = item.classList.contains('active');
        options[option] = input.checked;
        generatePassword();
      });
    });

    // Length slider
    lengthSlider.addEventListener('input', (e) => {
      options.length = parseInt(e.target.value);
      lengthValue.textContent = options.length;
      generatePassword();
    });

    // Generate button
    generateBtn.addEventListener('click', generatePassword);

    // Copy buttons
    copyBtn.addEventListener('click', copyPassword);
    copyBtnLarge.addEventListener('click', copyPassword);

    // Checker input
    checkerInput.addEventListener('input', (e) => {
      if (e.target.value) {
        checkPassword(e.target.value);
        checkerResults.classList.add('visible');
      } else {
        checkerResults.classList.remove('visible');
      }
    });

    function generatePassword() {
      let charset = '';
      if (options.uppercase) charset += charsets.uppercase;
      if (options.lowercase) charset += charsets.lowercase;
      if (options.numbers) charset += charsets.numbers;
      if (options.symbols) charset += charsets.symbols;

      if (!charset) {
        passwordEl.textContent = 'Select at least one option';
        return;
      }

      // Use crypto.getRandomValues for secure randomness
      const array = new Uint32Array(options.length);
      crypto.getRandomValues(array);

      let password = '';
      for (let i = 0; i < options.length; i++) {
        password += charset[array[i] % charset.length];
      }

      passwordEl.textContent = password;
      updateStrengthMeter(password, strengthMeter, strengthLabel);
    }

    function copyPassword() {
      const password = passwordEl.textContent;
      if (password === 'Click Generate' || password === 'Select at least one option') {
        return;
      }

      navigator.clipboard.writeText(password).then(() => {
        showToast();
      });
    }

    function showToast() {
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2000);
    }

    function calculateStrength(password) {
      let score = 0;
      const length = password.length;

      // Length scoring
      if (length >= 8) score += 1;
      if (length >= 12) score += 1;
      if (length >= 16) score += 1;
      if (length >= 20) score += 1;

      // Character diversity
      const hasUpper = /[A-Z]/.test(password);
      const hasLower = /[a-z]/.test(password);
      const hasNumber = /[0-9]/.test(password);
      const hasSymbol = /[^A-Za-z0-9]/.test(password);

      const diversity = [hasUpper, hasLower, hasNumber, hasSymbol].filter(Boolean).length;
      score += diversity;

      // Penalize patterns
      if (/(.)\1{2,}/.test(password)) score -= 1; // Repeated chars
      if (/^[a-zA-Z]+$/.test(password)) score -= 1; // Only letters
      if (/^[0-9]+$/.test(password)) score -= 1; // Only numbers

      // Normalize to 0-4
      return Math.max(0, Math.min(4, Math.floor(score / 2)));
    }

    function updateStrengthMeter(password, meter, label) {
      const strength = calculateStrength(password);
      const strengths = ['weak', 'weak', 'fair', 'good', 'strong'];
      const labels = ['Weak', 'Weak', 'Fair', 'Good', 'Strong'];

      meter.dataset.strength = strengths[strength];
      label.textContent = labels[strength];

      const bars = meter.querySelectorAll('.strength-bar');
      bars.forEach((bar, i) => {
        bar.classList.toggle('active', i < strength);
      });
    }

    function checkPassword(password) {
      const checkerStrength = document.getElementById('checkerStrength');
      const checkerStrengthLabel = document.getElementById('checkerStrengthLabel');
      const crackTime = document.getElementById('crackTime');
      const crackDetail = document.getElementById('crackDetail');
      const criteriaList = document.getElementById('criteriaList');

      updateStrengthMeter(password, checkerStrength, checkerStrengthLabel);

      // Calculate entropy and crack time
      let charsetSize = 0;
      if (/[a-z]/.test(password)) charsetSize += 26;
      if (/[A-Z]/.test(password)) charsetSize += 26;
      if (/[0-9]/.test(password)) charsetSize += 10;
      if (/[^A-Za-z0-9]/.test(password)) charsetSize += 32;

      const entropy = password.length * Math.log2(charsetSize || 1);
      const combinations = Math.pow(2, entropy);
      const guessesPerSecond = 10000000000; // 10 billion (modern GPU cluster)
      const seconds = combinations / guessesPerSecond / 2; // Average case

      crackTime.textContent = formatTime(seconds);
      crackDetail.textContent = `Based on ${(guessesPerSecond / 1e9).toFixed(0)}B guesses/sec (GPU cluster)`;

      // Criteria check
      const criteria = [
        { label: '8+ chars', pass: password.length >= 8 },
        { label: '12+ chars', pass: password.length >= 12 },
        { label: 'Uppercase', pass: /[A-Z]/.test(password) },
        { label: 'Lowercase', pass: /[a-z]/.test(password) },
        { label: 'Numbers', pass: /[0-9]/.test(password) },
        { label: 'Symbols', pass: /[^A-Za-z0-9]/.test(password) }
      ];

      criteriaList.innerHTML = criteria.map(c => `
        <span class="criteria-item ${c.pass ? 'pass' : 'fail'}">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            ${c.pass 
              ? '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>'
              : '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>'}
          </svg>
          ${c.label}
        </span>
      `).join('');
    }

    function formatTime(seconds) {
      if (seconds < 1) return 'Instantly';
      if (seconds < 60) return `${Math.round(seconds)} seconds`;
      if (seconds < 3600) return `${Math.round(seconds / 60)} minutes`;
      if (seconds < 86400) return `${Math.round(seconds / 3600)} hours`;
      if (seconds < 31536000) return `${Math.round(seconds / 86400)} days`;
      if (seconds < 31536000 * 100) return `${Math.round(seconds / 31536000)} years`;
      if (seconds < 31536000 * 1000) return `${Math.round(seconds / 31536000)} centuries`;
      if (seconds < 31536000 * 1e6) return `${(seconds / 31536000 / 1000).toFixed(0)}k years`;
      if (seconds < 31536000 * 1e9) return `${(seconds / 31536000 / 1e6).toFixed(0)}M years`;
      if (seconds < 31536000 * 1e12) return `${(seconds / 31536000 / 1e9).toFixed(0)}B years`;
      return '∞ (heat death of universe)';
    }

    // Generate initial password
    generatePassword();
  </script>
