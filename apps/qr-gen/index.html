<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Generator — No Sign Up | Philbin</title>
  <meta name="description" content="Generate QR codes instantly. URLs, text, WiFi, contacts. No account required. 100% free, runs in your browser.">
  <meta name="keywords" content="qr code generator, free qr code, qr code no sign up, wifi qr code, qr maker">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📱</text></svg>">
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --surface-hover: #252525;
      --border: #333;
      --text: #e5e5e5;
      --text-muted: #888;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --success: #22c55e;
      --error: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }
    header {
      text-align: center;
      margin-bottom: 2rem;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }
    .tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    .tab {
      padding: 0.5rem 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    .tab:hover {
      background: var(--surface-hover);
      color: var(--text);
    }
    .tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }
    .form-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    .form-group:last-child {
      margin-bottom: 0;
    }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
      color: var(--text-muted);
    }
    input, textarea, select {
      width: 100%;
      padding: 0.75rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 1rem;
      transition: border-color 0.2s;
    }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--accent);
    }
    textarea {
      resize: vertical;
      min-height: 80px;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    @media (max-width: 500px) {
      .row { grid-template-columns: 1fr; }
    }
    .btn {
      width: 100%;
      padding: 0.875rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover {
      background: var(--accent-hover);
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .qr-output {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
      display: none;
    }
    .qr-output.visible {
      display: block;
    }
    #qr-canvas {
      max-width: 100%;
      border-radius: 8px;
      background: white;
    }
    .download-btns {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .download-btn {
      padding: 0.5rem 1rem;
      background: var(--surface-hover);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
    }
    .download-btn:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }
    .hidden { display: none !important; }
    footer {
      text-align: center;
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.85rem;
    }
    footer a {
      color: var(--accent);
      text-decoration: none;
    }
    .options-row {
      display: flex;
      gap: 1rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }
    .option-group {
      flex: 1;
      min-width: 120px;
    }
    .color-input {
      width: 100%;
      height: 40px;
      padding: 2px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📱 QR Code Generator</h1>
      <p class="subtitle">Create QR codes instantly. No sign-up required.</p>
    </header>

    <div class="tabs">
      <button class="tab active" data-type="url">🔗 URL</button>
      <button class="tab" data-type="text">📝 Text</button>
      <button class="tab" data-type="wifi">📶 WiFi</button>
      <button class="tab" data-type="email">✉️ Email</button>
      <button class="tab" data-type="phone">📞 Phone</button>
      <button class="tab" data-type="sms">💬 SMS</button>
    </div>

    <div class="form-section">
      <!-- URL Form -->
      <div id="form-url" class="form-content">
        <div class="form-group">
          <label for="url-input">Website URL</label>
          <input type="url" id="url-input" placeholder="https://example.com" value="">
        </div>
      </div>

      <!-- Text Form -->
      <div id="form-text" class="form-content hidden">
        <div class="form-group">
          <label for="text-input">Text Content</label>
          <textarea id="text-input" placeholder="Enter any text..."></textarea>
        </div>
      </div>

      <!-- WiFi Form -->
      <div id="form-wifi" class="form-content hidden">
        <div class="form-group">
          <label for="wifi-ssid">Network Name (SSID)</label>
          <input type="text" id="wifi-ssid" placeholder="MyWiFiNetwork">
        </div>
        <div class="form-group">
          <label for="wifi-password">Password</label>
          <input type="text" id="wifi-password" placeholder="Enter password">
        </div>
        <div class="form-group">
          <label for="wifi-security">Security Type</label>
          <select id="wifi-security">
            <option value="WPA">WPA/WPA2</option>
            <option value="WEP">WEP</option>
            <option value="nopass">No Password</option>
          </select>
        </div>
      </div>

      <!-- Email Form -->
      <div id="form-email" class="form-content hidden">
        <div class="form-group">
          <label for="email-address">Email Address</label>
          <input type="email" id="email-address" placeholder="hello@example.com">
        </div>
        <div class="form-group">
          <label for="email-subject">Subject (optional)</label>
          <input type="text" id="email-subject" placeholder="Meeting Request">
        </div>
        <div class="form-group">
          <label for="email-body">Message (optional)</label>
          <textarea id="email-body" placeholder="Hi, I'd like to discuss..."></textarea>
        </div>
      </div>

      <!-- Phone Form -->
      <div id="form-phone" class="form-content hidden">
        <div class="form-group">
          <label for="phone-number">Phone Number</label>
          <input type="tel" id="phone-number" placeholder="+1 555 123 4567">
        </div>
      </div>

      <!-- SMS Form -->
      <div id="form-sms" class="form-content hidden">
        <div class="form-group">
          <label for="sms-number">Phone Number</label>
          <input type="tel" id="sms-number" placeholder="+1 555 123 4567">
        </div>
        <div class="form-group">
          <label for="sms-message">Message (optional)</label>
          <textarea id="sms-message" placeholder="Hey! Just scanning to say hi..."></textarea>
        </div>
      </div>

      <div class="options-row">
        <div class="option-group">
          <label for="qr-size">Size</label>
          <select id="qr-size">
            <option value="200">Small (200px)</option>
            <option value="300" selected>Medium (300px)</option>
            <option value="400">Large (400px)</option>
            <option value="600">Extra Large (600px)</option>
          </select>
        </div>
        <div class="option-group">
          <label for="qr-fg">Color</label>
          <input type="color" id="qr-fg" class="color-input" value="#000000">
        </div>
        <div class="option-group">
          <label for="qr-bg">Background</label>
          <input type="color" id="qr-bg" class="color-input" value="#ffffff">
        </div>
      </div>

      <button class="btn" id="generate-btn" style="margin-top: 1.5rem;">Generate QR Code</button>
    </div>

    <div class="qr-output" id="qr-output">
      <canvas id="qr-canvas"></canvas>
      <div class="download-btns">
        <a class="download-btn" id="download-png">⬇️ Download PNG</a>
        <a class="download-btn" id="download-svg">⬇️ Download SVG</a>
        <button class="download-btn" id="copy-btn">📋 Copy to Clipboard</button>
      </div>
    </div>

    <footer>
      <p>100% free. No data leaves your browser.</p>
      <p style="margin-top: 0.5rem;">Created with <a href="https://alexstuartharris.github.io/philbin/">Philbin</a></p>
    </footer>
  </div>

  <script>
    const tabs = document.querySelectorAll('.tab');
    const forms = document.querySelectorAll('.form-content');
    const generateBtn = document.getElementById('generate-btn');
    const output = document.getElementById('qr-output');
    const canvas = document.getElementById('qr-canvas');
    const downloadPng = document.getElementById('download-png');
    const downloadSvg = document.getElementById('download-svg');
    const copyBtn = document.getElementById('copy-btn');

    let currentType = 'url';
    let currentData = '';

    // Tab switching
    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentType = tab.dataset.type;
        forms.forEach(f => f.classList.add('hidden'));
        document.getElementById(`form-${currentType}`).classList.remove('hidden');
      });
    });

    // Generate QR data based on type
    function getQRData() {
      switch (currentType) {
        case 'url':
          return document.getElementById('url-input').value.trim();
        case 'text':
          return document.getElementById('text-input').value.trim();
        case 'wifi': {
          const ssid = document.getElementById('wifi-ssid').value.trim();
          const pass = document.getElementById('wifi-password').value;
          const sec = document.getElementById('wifi-security').value;
          if (!ssid) return '';
          return `WIFI:T:${sec};S:${ssid};P:${pass};;`;
        }
        case 'email': {
          const addr = document.getElementById('email-address').value.trim();
          const subj = document.getElementById('email-subject').value.trim();
          const body = document.getElementById('email-body').value.trim();
          if (!addr) return '';
          let mailto = `mailto:${addr}`;
          const params = [];
          if (subj) params.push(`subject=${encodeURIComponent(subj)}`);
          if (body) params.push(`body=${encodeURIComponent(body)}`);
          if (params.length) mailto += '?' + params.join('&');
          return mailto;
        }
        case 'phone': {
          const num = document.getElementById('phone-number').value.trim();
          return num ? `tel:${num.replace(/\s/g, '')}` : '';
        }
        case 'sms': {
          const num = document.getElementById('sms-number').value.trim();
          const msg = document.getElementById('sms-message').value.trim();
          if (!num) return '';
          let sms = `sms:${num.replace(/\s/g, '')}`;
          if (msg) sms += `?body=${encodeURIComponent(msg)}`;
          return sms;
        }
        default:
          return '';
      }
    }

    // Generate QR Code
    generateBtn.addEventListener('click', async () => {
      const data = getQRData();
      if (!data) {
        alert('Please enter some content to generate a QR code.');
        return;
      }

      currentData = data;
      const size = parseInt(document.getElementById('qr-size').value);
      const fg = document.getElementById('qr-fg').value;
      const bg = document.getElementById('qr-bg').value;

      try {
        await QRCode.toCanvas(canvas, data, {
          width: size,
          margin: 2,
          color: { dark: fg, light: bg }
        });
        output.classList.add('visible');
        
        // Update PNG download
        downloadPng.href = canvas.toDataURL('image/png');
        downloadPng.download = 'qrcode.png';

        // Generate SVG for download
        const svgString = await QRCode.toString(data, {
          type: 'svg',
          width: size,
          margin: 2,
          color: { dark: fg, light: bg }
        });
        const svgBlob = new Blob([svgString], { type: 'image/svg+xml' });
        downloadSvg.href = URL.createObjectURL(svgBlob);
        downloadSvg.download = 'qrcode.svg';
      } catch (err) {
        alert('Error generating QR code: ' + err.message);
      }
    });

    // Copy to clipboard
    copyBtn.addEventListener('click', async () => {
      try {
        const blob = await new Promise(resolve => canvas.toBlob(resolve));
        await navigator.clipboard.write([
          new ClipboardItem({ 'image/png': blob })
        ]);
        copyBtn.textContent = '✅ Copied!';
        setTimeout(() => { copyBtn.textContent = '📋 Copy to Clipboard'; }, 2000);
      } catch (err) {
        // Fallback: copy the data string
        await navigator.clipboard.writeText(currentData);
        copyBtn.textContent = '✅ Text Copied!';
        setTimeout(() => { copyBtn.textContent = '📋 Copy to Clipboard'; }, 2000);
      }
    });

    // Auto-generate on Enter key
    document.querySelectorAll('input, textarea').forEach(el => {
      el.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          generateBtn.click();
        }
      });
    });
  </script>
</body>
</html>
