<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompt Library</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --surface-hover: #252525;
      --border: #333;
      --text: #e0e0e0;
      --text-muted: #888;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.5rem;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 1rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
    }
    .header-actions {
      display: flex;
      gap: 0.5rem;
    }
    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 500;
      transition: background 0.2s;
    }
    button:hover { background: var(--accent-hover); }
    button.secondary {
      background: var(--surface);
      border: 1px solid var(--border);
    }
    button.secondary:hover { background: var(--surface-hover); }
    button.danger { background: var(--danger); }
    button.danger:hover { background: #dc2626; }
    
    .search-filter {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    input, textarea, select {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      font-size: 0.875rem;
    }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--accent);
    }
    .search-filter input {
      flex: 1;
      min-width: 200px;
    }
    .search-filter select {
      min-width: 150px;
    }

    .prompts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1rem;
    }
    .prompt-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.1s;
    }
    .prompt-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    .prompt-card h3 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .prompt-card .preview {
      color: var(--text-muted);
      font-size: 0.875rem;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 0.75rem;
      white-space: pre-wrap;
    }
    .tags {
      display: flex;
      gap: 0.375rem;
      flex-wrap: wrap;
    }
    .tag {
      background: var(--accent);
      color: white;
      padding: 0.125rem 0.5rem;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 500;
    }
    .category-badge {
      font-size: 0.75rem;
      background: var(--surface-hover);
      padding: 0.125rem 0.5rem;
      border-radius: 4px;
      color: var(--text-muted);
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1rem;
    }
    .modal-overlay.hidden { display: none; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 100%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-header h2 {
      font-size: 1.125rem;
      font-weight: 600;
    }
    .modal-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
      padding: 0;
      line-height: 1;
    }
    .modal-close:hover { color: var(--text); }
    .modal-body {
      padding: 1.5rem;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    .form-group label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 0.375rem;
    }
    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
    }
    .form-group textarea {
      min-height: 150px;
      resize: vertical;
      font-family: 'SF Mono', 'Consolas', monospace;
    }
    .form-row {
      display: flex;
      gap: 1rem;
    }
    .form-row .form-group { flex: 1; }
    .modal-footer {
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
    }

    /* View Modal */
    .view-modal .prompt-content {
      background: var(--bg);
      padding: 1rem;
      border-radius: 6px;
      font-family: 'SF Mono', 'Consolas', monospace;
      font-size: 0.875rem;
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 1rem;
      max-height: 300px;
      overflow-y: auto;
    }
    .view-modal .meta {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
      font-size: 0.875rem;
      color: var(--text-muted);
    }
    .view-modal .action-buttons {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .copied-toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      background: var(--success);
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-size: 0.875rem;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 2000;
    }
    .copied-toast.visible { opacity: 1; }

    .empty-state {
      text-align: center;
      padding: 3rem;
      color: var(--text-muted);
    }
    .empty-state h3 {
      font-size: 1.125rem;
      margin-bottom: 0.5rem;
      color: var(--text);
    }
    .stats {
      display: flex;
      gap: 1.5rem;
      margin-bottom: 1rem;
      font-size: 0.875rem;
      color: var(--text-muted);
    }
    .stats span { display: flex; align-items: center; gap: 0.25rem; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📝 Prompt Library</h1>
      <div class="header-actions">
        <button class="secondary" onclick="exportPrompts()">Export</button>
        <button class="secondary" onclick="document.getElementById('importFile').click()">Import</button>
        <input type="file" id="importFile" accept=".json" style="display:none" onchange="importPrompts(event)">
        <button onclick="openCreateModal()">+ New Prompt</button>
      </div>
    </header>

    <div class="stats" id="stats"></div>

    <div class="search-filter">
      <input type="text" id="searchInput" placeholder="Search prompts..." oninput="renderPrompts()">
      <select id="categoryFilter" onchange="renderPrompts()">
        <option value="">All Categories</option>
      </select>
      <select id="sortBy" onchange="renderPrompts()">
        <option value="recent">Recently Updated</option>
        <option value="created">Recently Created</option>
        <option value="name">Name A-Z</option>
        <option value="uses">Most Used</option>
      </select>
    </div>

    <div class="prompts-grid" id="promptsGrid"></div>
  </div>

  <!-- Create/Edit Modal -->
  <div class="modal-overlay hidden" id="editModal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">New Prompt</h2>
        <button class="modal-close" onclick="closeModal('editModal')">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="promptName">Name *</label>
          <input type="text" id="promptName" placeholder="e.g., Code Review Assistant">
        </div>
        <div class="form-group">
          <label for="promptContent">Prompt *</label>
          <textarea id="promptContent" placeholder="Enter your prompt here. Use {{variable}} for placeholders."></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="promptCategory">Category</label>
            <input type="text" id="promptCategory" placeholder="e.g., Coding, Writing, Analysis">
          </div>
          <div class="form-group">
            <label for="promptTags">Tags (comma separated)</label>
            <input type="text" id="promptTags" placeholder="e.g., gpt-4, detailed, technical">
          </div>
        </div>
        <div class="form-group">
          <label for="promptNotes">Notes</label>
          <textarea id="promptNotes" style="min-height: 60px;" placeholder="Any additional notes about this prompt..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="secondary" onclick="closeModal('editModal')">Cancel</button>
        <button onclick="savePrompt()">Save Prompt</button>
      </div>
    </div>
  </div>

  <!-- View Modal -->
  <div class="modal-overlay hidden" id="viewModal">
    <div class="modal view-modal">
      <div class="modal-header">
        <h2 id="viewTitle">Prompt</h2>
        <button class="modal-close" onclick="closeModal('viewModal')">&times;</button>
      </div>
      <div class="modal-body">
        <div class="prompt-content" id="viewContent"></div>
        <div class="meta" id="viewMeta"></div>
        <div class="tags" id="viewTags" style="margin-bottom: 1rem;"></div>
        <div id="viewNotes" style="margin-bottom: 1rem; font-size: 0.875rem; color: var(--text-muted);"></div>
        <div class="action-buttons">
          <button onclick="copyPrompt()">📋 Copy</button>
          <button onclick="usePrompt()">🚀 Use (+1)</button>
          <button class="secondary" onclick="editCurrentPrompt()">✏️ Edit</button>
          <button class="danger" onclick="deleteCurrentPrompt()">🗑️ Delete</button>
        </div>
      </div>
    </div>
  </div>

  <div class="copied-toast" id="toast">Copied to clipboard!</div>

  <script>
    const STORAGE_KEY = 'prompt-library-v1';
    let prompts = [];
    let currentPromptId = null;
    let editingPromptId = null;

    // Load from localStorage
    function loadPrompts() {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) {
        try {
          prompts = JSON.parse(stored);
        } catch (e) {
          prompts = [];
        }
      }
    }

    function saveToStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(prompts));
    }

    function generateId() {
      return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
    }

    function getCategories() {
      const cats = new Set();
      prompts.forEach(p => {
        if (p.category) cats.add(p.category);
      });
      return Array.from(cats).sort();
    }

    function updateCategoryFilter() {
      const select = document.getElementById('categoryFilter');
      const current = select.value;
      const cats = getCategories();
      select.innerHTML = '<option value="">All Categories</option>' +
        cats.map(c => `<option value="${c}">${c}</option>`).join('');
      select.value = current;
    }

    function updateStats() {
      const total = prompts.length;
      const cats = getCategories().length;
      const totalUses = prompts.reduce((sum, p) => sum + (p.uses || 0), 0);
      document.getElementById('stats').innerHTML = `
        <span>📄 ${total} prompt${total !== 1 ? 's' : ''}</span>
        <span>📁 ${cats} categor${cats !== 1 ? 'ies' : 'y'}</span>
        <span>🚀 ${totalUses} total uses</span>
      `;
    }

    function renderPrompts() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const category = document.getElementById('categoryFilter').value;
      const sortBy = document.getElementById('sortBy').value;

      let filtered = prompts.filter(p => {
        const matchesSearch = !search ||
          p.name.toLowerCase().includes(search) ||
          p.content.toLowerCase().includes(search) ||
          (p.tags || []).some(t => t.toLowerCase().includes(search));
        const matchesCat = !category || p.category === category;
        return matchesSearch && matchesCat;
      });

      // Sort
      filtered.sort((a, b) => {
        switch (sortBy) {
          case 'recent': return (b.updatedAt || b.createdAt) - (a.updatedAt || a.createdAt);
          case 'created': return b.createdAt - a.createdAt;
          case 'name': return a.name.localeCompare(b.name);
          case 'uses': return (b.uses || 0) - (a.uses || 0);
          default: return 0;
        }
      });

      const grid = document.getElementById('promptsGrid');
      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="empty-state" style="grid-column: 1 / -1;">
            <h3>${prompts.length === 0 ? 'No prompts yet' : 'No matches found'}</h3>
            <p>${prompts.length === 0 ? 'Click "+ New Prompt" to create your first prompt.' : 'Try a different search or filter.'}</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(p => `
        <div class="prompt-card" onclick="openViewModal('${p.id}')">
          <h3>
            ${escapeHtml(p.name)}
            ${p.category ? `<span class="category-badge">${escapeHtml(p.category)}</span>` : ''}
          </h3>
          <div class="preview">${escapeHtml(p.content)}</div>
          <div class="tags">
            ${(p.tags || []).slice(0, 4).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}
            ${(p.tags || []).length > 4 ? `<span class="tag">+${p.tags.length - 4}</span>` : ''}
          </div>
        </div>
      `).join('');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function openCreateModal() {
      editingPromptId = null;
      document.getElementById('modalTitle').textContent = 'New Prompt';
      document.getElementById('promptName').value = '';
      document.getElementById('promptContent').value = '';
      document.getElementById('promptCategory').value = '';
      document.getElementById('promptTags').value = '';
      document.getElementById('promptNotes').value = '';
      document.getElementById('editModal').classList.remove('hidden');
    }

    function openEditModal(id) {
      const p = prompts.find(x => x.id === id);
      if (!p) return;
      editingPromptId = id;
      document.getElementById('modalTitle').textContent = 'Edit Prompt';
      document.getElementById('promptName').value = p.name;
      document.getElementById('promptContent').value = p.content;
      document.getElementById('promptCategory').value = p.category || '';
      document.getElementById('promptTags').value = (p.tags || []).join(', ');
      document.getElementById('promptNotes').value = p.notes || '';
      closeModal('viewModal');
      document.getElementById('editModal').classList.remove('hidden');
    }

    function closeModal(id) {
      document.getElementById(id).classList.add('hidden');
    }

    function savePrompt() {
      const name = document.getElementById('promptName').value.trim();
      const content = document.getElementById('promptContent').value.trim();
      const category = document.getElementById('promptCategory').value.trim();
      const tagsRaw = document.getElementById('promptTags').value;
      const notes = document.getElementById('promptNotes').value.trim();

      if (!name || !content) {
        alert('Name and prompt content are required.');
        return;
      }

      const tags = tagsRaw.split(',').map(t => t.trim()).filter(Boolean);

      if (editingPromptId) {
        const idx = prompts.findIndex(p => p.id === editingPromptId);
        if (idx !== -1) {
          prompts[idx] = {
            ...prompts[idx],
            name,
            content,
            category: category || null,
            tags,
            notes: notes || null,
            updatedAt: Date.now()
          };
        }
      } else {
        prompts.push({
          id: generateId(),
          name,
          content,
          category: category || null,
          tags,
          notes: notes || null,
          uses: 0,
          createdAt: Date.now(),
          updatedAt: Date.now()
        });
      }

      saveToStorage();
      closeModal('editModal');
      updateCategoryFilter();
      updateStats();
      renderPrompts();
    }

    function openViewModal(id) {
      const p = prompts.find(x => x.id === id);
      if (!p) return;
      currentPromptId = id;
      document.getElementById('viewTitle').textContent = p.name;
      document.getElementById('viewContent').textContent = p.content;
      
      const created = new Date(p.createdAt).toLocaleDateString();
      const updated = p.updatedAt ? new Date(p.updatedAt).toLocaleDateString() : created;
      document.getElementById('viewMeta').innerHTML = `
        <span>📁 ${p.category || 'Uncategorized'}</span>
        <span>🚀 Used ${p.uses || 0} times</span>
        <span>📅 Created ${created}</span>
        ${updated !== created ? `<span>✏️ Updated ${updated}</span>` : ''}
      `;
      
      document.getElementById('viewTags').innerHTML =
        (p.tags || []).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('');
      
      document.getElementById('viewNotes').textContent = p.notes || '';
      document.getElementById('viewNotes').style.display = p.notes ? 'block' : 'none';
      
      document.getElementById('viewModal').classList.remove('hidden');
    }

    function copyPrompt() {
      const p = prompts.find(x => x.id === currentPromptId);
      if (!p) return;
      navigator.clipboard.writeText(p.content);
      showToast('Copied to clipboard!');
    }

    function usePrompt() {
      const idx = prompts.findIndex(x => x.id === currentPromptId);
      if (idx === -1) return;
      prompts[idx].uses = (prompts[idx].uses || 0) + 1;
      saveToStorage();
      navigator.clipboard.writeText(prompts[idx].content);
      showToast('Copied! Use count +1');
      // Update view modal meta
      const p = prompts[idx];
      document.getElementById('viewMeta').querySelector('span:nth-child(2)').textContent = `🚀 Used ${p.uses} times`;
      updateStats();
    }

    function editCurrentPrompt() {
      openEditModal(currentPromptId);
    }

    function deleteCurrentPrompt() {
      if (!confirm('Delete this prompt? This cannot be undone.')) return;
      prompts = prompts.filter(p => p.id !== currentPromptId);
      saveToStorage();
      closeModal('viewModal');
      updateCategoryFilter();
      updateStats();
      renderPrompts();
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('visible');
      setTimeout(() => toast.classList.remove('visible'), 2000);
    }

    function exportPrompts() {
      const blob = new Blob([JSON.stringify(prompts, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `prompt-library-${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Exported!');
    }

    function importPrompts(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const imported = JSON.parse(e.target.result);
          if (!Array.isArray(imported)) throw new Error('Invalid format');
          // Merge: add new prompts, skip duplicates by id
          const existingIds = new Set(prompts.map(p => p.id));
          let added = 0;
          imported.forEach(p => {
            if (p.id && p.name && p.content && !existingIds.has(p.id)) {
              prompts.push(p);
              added++;
            }
          });
          saveToStorage();
          updateCategoryFilter();
          updateStats();
          renderPrompts();
          showToast(`Imported ${added} prompt${added !== 1 ? 's' : ''}!`);
        } catch (err) {
          alert('Failed to import: ' + err.message);
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    // Init
    loadPrompts();
    updateCategoryFilter();
    updateStats();
    renderPrompts();

    // Close modals on escape
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeModal('editModal');
        closeModal('viewModal');
      }
    });

    // Close modal on backdrop click
    document.querySelectorAll('.modal-overlay').forEach(overlay => {
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) {
          overlay.classList.add('hidden');
        }
      });
    });
  </script>
</body>
</html>
