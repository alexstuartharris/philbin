name: Update Events

on:
  schedule:
    - cron: '0 12 * * *'  # Daily at noon UTC (4am PT)
  workflow_dispatch:  # Manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
      
      - name: Run scanner
        run: |
          python scanner.py > raw_output.txt 2>&1
          echo "Scanner completed"
      
      - name: Generate JSON
        run: |
          python generate-json.py
      
      - name: Commit and push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data/events.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update events $(date -u +'%Y-%m-%d %H:%M UTC')" && git push)
